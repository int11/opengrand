<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>장치 고르기 · Choose a device</title>
  <style>
    :root { color-scheme: light dark; --bg: #ffffff; --fg: #1b1f24; --muted: #667080; --line: #d8dde3; --hi: #1f6feb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111418; --fg: #e6e9ee; --muted: #8b95a3; --line: #2a3038; --hi: #4c8dff; } }
    body { margin: 0; font: 14px/1.4 system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; height: 100vh; }
    header { padding: 14px 16px 6px; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    p { margin: 0; color: var(--muted); }
    ul { list-style: none; margin: 8px 0; padding: 0 8px; overflow: auto; flex: 1; }
    li button { width: 100%; text-align: left; padding: 10px 12px; margin: 2px 0; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    li button:hover, li button:focus { border-color: var(--hi); outline: none; }
    li small { display: block; color: var(--muted); font-size: 11px; word-break: break-all; }
    footer { padding: 10px 16px 14px; display: flex; justify-content: flex-end; border-top: 1px solid var(--line); }
    footer button { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: inherit; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">장치 고르기 · Choose a device</h1>
    <p id="state">찾는 중… · Searching…</p>
  </header>
  <ul id="list"></ul>
  <footer><button id="cancel">취소 · Cancel</button></footer>
  <script src="picker.js"></script>
</body>
</html>
